<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>RESI Chat Questions</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f3f4;
      color: #202124;
      font: 16px/1.5 Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 560px);
      padding: 40px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(60, 64, 67, .28);
    }
    h1 { margin: 0 0 24px; font-size: 28px; font-weight: 400; }
    p { margin: 0 0 12px; }
    a { color: #1155cc; }
    button { margin-bottom: 24px; font: inherit; cursor: pointer; }
    a:focus-visible, button:focus-visible {
      outline: 2px solid #1a73e8;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p>RESI Chat Questions</p>
    <h1 id="status" aria-live="polite">Will be added soon</h1>
    <button id="retry" type="button" hidden>Try again</button>
    <noscript><p>Enable JavaScript to open the question form, or contact <a href="mailto:hello@resi.org">hello@resi.org</a>.</p></noscript>
    <a href="/">Back to RESI</a>
  </main>
  <script>
    const status = document.getElementById("status");
    const retry = document.getElementById("retry");
    let latestLookup = 0;

    async function checkDestination() {
      const lookup = ++latestLookup;
      retry.hidden = true;
      try {
        // GitHub Pages caches HTML. Keep the destination out of that HTML,
        // bypass the browser cache, and use a unique URL for the CDN lookup.
        const config = new URL("/ask/destination.json", location.origin);
        config.searchParams.set("check", Date.now() + "-" + Math.random().toString(36).slice(2));
        const response = await fetch(config, { cache: "no-store" });
        if (!response.ok) throw new Error("Destination lookup failed");
        const { url } = await response.json();
        if (lookup !== latestLookup) return;
        if (url === null) {
          status.textContent = "Will be added soon";
          return;
        }
        if (typeof url !== "string") throw new Error("Invalid destination");
        const target = new URL(url);
        const samePage = target.origin === location.origin &&
          target.pathname.replace(/\/$/, "") === location.pathname.replace(/\/$/, "");
        if (target.protocol !== "https:" || samePage) throw new Error("Invalid destination");
        status.textContent = "Opening the question form...";
        location.replace(target.href);
      } catch (error) {
        if (lookup !== latestLookup) return;
        status.textContent = "The question form is temporarily unavailable.";
        retry.hidden = false;
      }
    }

    // pageshow also runs when a browser restores this page from its history.
    window.addEventListener("pageshow", checkDestination);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") checkDestination();
    });
    retry.addEventListener("click", checkDestination);
  </script>
</body>
</html>
