<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RESI is coming soon.">
  <title>RESI</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5f0;
      --ink: #161a1d;
      --muted: #5d646b;
      --line: #d9d2c5;
      --accent: #0f766e;
      --accent-strong: #0b4f4a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1314;
        --ink: #f2f0ea;
        --muted: #aab3b5;
        --line: #2a3436;
        --accent: #5eead4;
        --accent-strong: #99f6e4;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    main {
      min-height: 100vh;
      display: grid;
      align-items: center;
      padding: 48px 24px;
    }

    .content {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .label {
      margin: 0 0 28px;
      color: var(--accent-strong);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(56px, 13vw, 128px);
      line-height: 0.95;
      letter-spacing: 0;
      font-weight: 780;
    }

    .rule {
      width: 100%;
      height: 1px;
      margin: 36px 0;
      background: var(--line);
    }

    .status {
      margin: 0 0 14px;
      font-size: clamp(24px, 5vw, 44px);
      line-height: 1.12;
      letter-spacing: 0;
      font-weight: 680;
    }

    .contact {
      max-width: 560px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
    }

    a {
      color: var(--accent-strong);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <section class="content" aria-label="RESI coming soon">
      <p class="label">resi.org</p>
      <h1>RESI</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="status">Coming soon.</p>
      <p class="contact">For inquiries, contact <a href="mailto:info@resi.org">info@resi.org</a>.</p>
    </section>
  </main>
</body>
</html>
