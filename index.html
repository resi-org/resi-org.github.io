<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="resi.org is coming soon.">
  <title>resi.org</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5f0;
      --ink: #161a1d;
      --muted: #5d646b;
      --accent: #0b4f4a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1314;
        --ink: #f2f0ea;
        --muted: #aab3b5;
        --accent: #99f6e4;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      text-align: center;
    }

    .content {
      width: min(100%, 560px);
    }

    .site {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.08;
      letter-spacing: 0;
      font-weight: 680;
    }

    .contact {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <section class="content" aria-label="resi.org coming soon">
      <p class="site">resi.org</p>
      <h1>Coming soon.</h1>
      <p class="contact">Contact <a href="mailto:info@resi.org">info@resi.org</a>.</p>
    </section>
  </main>
</body>
</html>
